name: Build Interact Box

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: win98
            toolchain: /opt/cmake/toolchains/win32_mingw_13.cmake
            artifact_path: 'installer/*.exe'

          - target: winxp
            toolchain: /opt/cmake/toolchains/win32_mingw_13.cmake
            artifact_path: 'installer/*.exe'

          - target: vista
            toolchain: /opt/cmake/toolchains/win32_mingw_13_x86_64.cmake
            artifact_path: 'installer/*.exe'

          - target: linux-gtk
            toolchain: ''
            gui: gtk3
            artifact_path: 'interact_box.tar.gz'

          - target: linux-qt
            toolchain: ''
            gui: qt
            artifact_path: 'interact_box.tar.gz'

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          BUILD_FLAGS=""
          TOOLKIT=""

          # On Windows, specify toolchain and version. On Linux, specify GUI toolkit
          if [[ "${{ matrix.target }}" != linux* ]]; then
            TOOLKIT="-DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }}"
            BUILD_FLAGS="-DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} -DTARGET_WINDOWS_VERSION=${{ matrix.target }}"
            
          else
            BUILD_FLAGS="-DTARGET_LINUX_GUI=${{ matrix.gui }}"
          fi
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            -w /src \
            ${{ secrets.DOCKERHUB_USERNAME }}/mingw_for_interact_box:latest \
            cmake -B build-${{ matrix.target }} \
                  -S . \
                  -G Ninja \
                  $BUILD_FLAGS \
                  -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/src \
            -w /src \
            ${{ secrets.DOCKERHUB_USERNAME }}/mingw_for_interact_box:latest \
            cmake --build build-${{ matrix.target }} --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interactbox-${{ matrix.target }}
          path: build-${{ matrix.target }}/${{ matrix.artifact_path }}
